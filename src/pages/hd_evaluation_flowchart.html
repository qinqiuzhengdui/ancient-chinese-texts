<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古籍高清化质量评估流程图</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --border-color: rgba(197, 160, 89, 0.15);
      --accent-gold: #c5a059;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 60px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    h2 {
      font-size: 26px;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 50px;
      text-align: center;
    }

    /* 流程图主容器 */
    .flow-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
      max-width: 1100px;
    }

    .flow-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap;
    }

    /* 单个评估节点 */
    .eval-node {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      width: 170px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .eval-node::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      border-radius: 16px 16px 0 0;
      background: var(--node-color, var(--accent-gold));
    }

    .eval-node:hover {
      transform: translateY(-5px);
      border-color: var(--node-color, var(--accent-gold));
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    /* 节点图标外壳 */
    .node-icon-wrapper {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(197, 160, 89, 0.1);
      border: 1px solid rgba(197, 160, 89, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      color: var(--node-color, var(--accent-gold));
      transition: all 0.3s;
    }

    .eval-node:hover .node-icon-wrapper {
      background: var(--node-color, var(--accent-gold));
      color: #000;
      transform: scale(1.1);
    }

    /* 节点标题 */
    .node-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    /* 节点描述 */
    .node-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* 评估分支决策卡 */
    .decision-box {
      width: 100px;
      height: 100px;
      background: var(--card-bg);
      border: 1.5px solid var(--accent-purple);
      transform: rotate(45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 10px 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.3s;
    }

    .decision-box:hover {
      border-color: var(--accent-pink);
    }

    .decision-content {
      transform: rotate(-45deg);
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* 横向连接箭头 */
    .flow-arrow {
      display: flex;
      align-items: center;
      position: relative;
      width: 32px;
      height: 10px;
    }

    .arrow-line {
      width: 100%;
      height: 1.5px;
      background: var(--arrow-color, #c5a059);
    }

    .arrow-head {
      position: absolute;
      right: -2px;
      top: -4px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid var(--arrow-color, #c5a059);
    }

    /* 决策结果卡片 */
    .result-node {
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      min-width: 110px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* 下级折线流向 */
    .vertical-link {
      width: 2px;
      height: 24px;
      background: var(--accent-purple);
    }

    @media (max-width: 900px) {
      .flow-row {
        flex-direction: column;
        gap: 20px;
      }
      .flow-arrow {
        transform: rotate(90deg);
        margin: 10px 0;
      }
    }
  </style>
</head>
<body>

  <h2>古籍高清化修复质量评估流程</h2>
  <div class="subtitle">AI双指标计算与人机交互联合验证工作流</div>

  <div class="flow-wrapper">
    
    <div class="flow-row">
      <!-- 步骤 1 -->
      <div class="eval-node" style="--node-color: var(--accent-blue);">
        <div class="node-icon-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </div>
        <div class="node-title">客观物理评估</div>
        <div class="node-desc">计算峰值信噪比（PSNR）与结构相似性（SSIM），从数学层面验证重构图像的信号还原纯度。</div>
      </div>

      <div class="flow-arrow" style="--arrow-color: var(--accent-blue);">
        <div class="arrow-line"></div>
        <div class="arrow-head"></div>
      </div>

      <!-- 步骤 2 -->
      <div class="eval-node" style="--node-color: var(--accent-purple);">
        <div class="node-icon-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        </div>
        <div class="node-title">多模态语义核验</div>
        <div class="node-desc">输入高清重构图至多模态VLM，核对OCR识别字符。评估字形和语义的匹配度。</div>
      </div>

      <div class="flow-arrow" style="--arrow-color: var(--accent-purple);">
        <div class="arrow-line"></div>
        <div class="arrow-head"></div>
      </div>

      <!-- 步骤 3 -->
      <div class="eval-node" style="--node-color: var(--accent-pink);">
        <div class="node-icon-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </div>
        <div class="node-title">风险智能审计</div>
        <div class="node-desc">智能扫描重构痕迹，标记由于霉斑造成的“概率性生成”和词库先验导致的“过度纠错”。</div>
      </div>

      <div class="flow-arrow" style="--arrow-color: var(--accent-pink);">
        <div class="arrow-line"></div>
        <div class="arrow-head"></div>
      </div>

      <!-- 步骤 4 -->
      <div class="eval-node" style="--node-color: var(--accent-gold);">
        <div class="node-icon-wrapper">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
        </div>
        <div class="node-title">人机交互滑动核对</div>
        <div class="node-desc">人工操作物理滑动条进行同轴实时比对，支持框选和批注，完成关键病害区域确认。</div>
      </div>

    </div>

    <!-- 连接下一层 -->
    <div class="vertical-link"></div>

    <!-- 决策阶段 -->
    <div class="flow-row">
      <div class="decision-box">
        <div class="decision-content">综合结论评估</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 15px; margin-left: 20px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="flow-arrow" style="--arrow-color: var(--accent-green); width: 24px;">
            <div class="arrow-line"></div>
            <div class="arrow-head"></div>
          </div>
          <div class="result-node" style="border-color: var(--accent-green); color: var(--accent-green); background: rgba(16, 185, 129, 0.08);">
            核对通过 (归档入库)
          </div>
        </div>
        
        <div style="display: flex; align-items: center; gap: 10px;">
          <div class="flow-arrow" style="--arrow-color: #ef4444; width: 24px;">
            <div class="arrow-line"></div>
            <div class="arrow-head"></div>
          </div>
          <div class="result-node" style="border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.08);">
            重新处理 (参数修正)
          </div>
        </div>
      </div>
    </div>

  </div>

</body>
</html>
