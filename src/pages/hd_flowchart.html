<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古籍高清化重建与核验流图</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(148, 163, 184, 0.1);
      --accent-gold: #c5a059;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    h2 {
      font-size: 28px;
      font-weight: 600;
      color: var(--accent-gold);
      margin-bottom: 8px;
      text-align: center;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 60px;
      text-align: center;
    }

    /* 流程图主容器 */
    .flowchart-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      max-width: 1200px;
      position: relative;
    }

    /* 单个节点卡片 */
    .flow-node {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 200px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: default;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .flow-node::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold));
      opacity: 0.7;
    }

    .flow-node:hover {
      transform: translateY(-8px);
      border-color: rgba(197, 160, 89, 0.4);
      box-shadow: 0 15px 35px rgba(197, 160, 89, 0.1);
    }

    /* 步骤编号 */
    .step-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent-gold);
      color: #000;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 0 10px rgba(197, 160, 89, 0.4);
    }

    /* 节点标题 */
    .node-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 12px;
    }

    /* 节点说明 */
    .node-desc {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 连接箭头 */
    .flow-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 40px;
      height: 40px;
    }

    .arrow-line {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-gold));
      position: relative;
    }

    .arrow-head {
      position: absolute;
      right: -2px;
      top: -4px;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid var(--accent-gold);
    }

    /* 动态渐变背景动画光效 */
    .flow-node:hover .step-badge {
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 5px rgba(197, 160, 89, 0.4);
      }
      100% {
        box-shadow: 0 0 20px rgba(197, 160, 89, 0.8);
      }
    }

    /* 环形布局（在大屏幕下可选） */
    @media (max-width: 900px) {
      .flowchart-container {
        flex-direction: column;
        gap: 30px;
      }
      .flow-arrow {
        transform: rotate(90deg);
        height: 20px;
      }
    }
  </style>
</head>
<body>

  <h2>古籍智慧高清重建与处理流程</h2>
  <div class="subtitle">数字元数据流转与技术透明闭环流程</div>

  <div class="flowchart-container">
    
    <!-- 步骤 1 -->
    <div class="flow-node">
      <div class="step-badge">01</div>
      <div class="node-title">源数据导入</div>
      <div class="node-desc">导入纸质扫描件或数字胶片，提取低清原始图层，建立溯源数字签名。</div>
    </div>

    <!-- 箭头 -->
    <div class="flow-arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
    </div>

    <!-- 步骤 2 -->
    <div class="flow-node" style="--accent-blue: #3b82f6;">
      <div class="step-badge">02</div>
      <div class="node-title">预处理与去噪</div>
      <div class="node-desc">运用自适应频域滤波与局部退化算子，消除纸张网网纹、霉斑等噪音。</div>
    </div>

    <!-- 箭头 -->
    <div class="flow-arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
    </div>

    <!-- 步骤 3 -->
    <div class="flow-node" style="--accent-blue: #8b5cf6;">
      <div class="step-badge">03</div>
      <div class="node-title">字形超分重构</div>
      <div class="node-desc">通过生成对抗网络与大模型先验，对破损字形笔画进行4x超分辨率智能重构。</div>
    </div>

    <!-- 箭头 -->
    <div class="flow-arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
    </div>

    <!-- 步骤 4 -->
    <div class="flow-node" style="--accent-blue: #ec4899;">
      <div class="step-badge">04</div>
      <div class="node-title">VLM风险核验</div>
      <div class="node-desc">调用多模态模型（如GLM-4.5V）进行双图对比，测算PSNR/SSIM，标记生成幻觉与过度纠错。</div>
    </div>

    <!-- 箭头 -->
    <div class="flow-arrow">
      <div class="arrow-line"></div>
      <div class="arrow-head"></div>
    </div>

    <!-- 步骤 5 -->
    <div class="flow-node" style="--accent-blue: #10b981;">
      <div class="step-badge">05</div>
      <div class="node-title">人工评估归档</div>
      <div class="node-desc">人工拉动滑块精细复核、添加方框批注，保存结论并自动追加审核流转日志元数据。</div>
    </div>

  </div>

</body>
</html>
